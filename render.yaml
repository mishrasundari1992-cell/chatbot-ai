databases:
  - name: company-chatbot-db
    databaseName: chatbot
    user: chatbot
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: company-chatbot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-chatbot-db
          property: connectionString
      - key: AI_PROVIDER_MODE
        value: bedrock
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: BEDROCK_CHAT_MODEL_ID
        value: apac.amazon.nova-micro-v1:0
      - key: BEDROCK_EMBEDDING_MODEL_ID
        value: amazon.titan-embed-text-v2:0
      - key: BEDROCK_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_CONTEXT_CHUNKS
        value: "5"
      - key: MONTHLY_TOKEN_LIMIT
        value: "1000000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_ANSWER_TOKENS
        value: "500"
